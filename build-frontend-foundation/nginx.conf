server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 30m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The browser uses one public origin. Nginx removes /api before forwarding
    # the request over Compose's private network to the NestJS container.
    location /api/ {
        proxy_pass http://nestjs:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
