[build]
  base = "build-frontend-foundation"
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_BACKEND_API_URL = "/api"

# Set UNIFIED_APP_URL in the Netlify dashboard to the public HTTPS origin of
# the Docker deployment. The build writes the /api proxy rule into out/_redirects.
