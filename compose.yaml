x-backend-env: &backend-env
  env_file:
    - ./.env

services:
  postgres:
    image: postgres:15
    container_name: manga-marketplace-db
    restart: unless-stopped
    volumes:
      - manga-marketplace-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-manga_marketplace}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-manga_marketplace}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend-env
    build:
      context: ./build-backend-foundation
      target: final
    command: ["npm", "run", "migration:run:compiled"]
    depends_on:
      postgres:
        condition: service_healthy

  nestjs:
    <<: *backend-env
    build:
      context: ./build-backend-foundation
      target: final
    container_name: manga-marketplace-api
    expose:
      - "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3001', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nextjs:
    build:
      context: ./build-frontend-foundation
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-/api}
    container_name: manga-marketplace-web
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      nestjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-build:
    build:
      context: ./build-frontend-foundation
      target: build-runner
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-/api}
    command: ["npm", "run", "build"]
    profiles: ["build"]

  backend-build:
    <<: *backend-env
    build:
      context: ./build-backend-foundation
      target: build-runner
    command: ["npm", "run", "build"]
    profiles: ["build"]

volumes:
  manga-marketplace-data:
