services:
  postgres:
    image: postgres:15
    container_name: manga-marketplace-db
    restart: unless-stopped
    volumes:
      - manga-marketplace-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-manga_marketplace}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-manga_marketplace}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./build-backend-foundation
      target: final
    environment:
      DATABASE_TARGET: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-manga_marketplace}
    command: ["npm", "run", "migration:run:compiled"]
    depends_on:
      postgres:
        condition: service_healthy

  nestjs:
    build:
      context: ./build-backend-foundation
      target: final
    container_name: manga-marketplace-api
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      DATABASE_TARGET: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-manga_marketplace}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-10000}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3001', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nextjs:
    build:
      context: ./build-frontend-foundation
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:3001}
    container_name: manga-marketplace-web
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      nestjs:
        condition: service_healthy

volumes:
  manga-marketplace-data:
